# Lotus Passport + Lotus Passport Security — nginx reverse proxy.
#
# Hosts:
#   passport.eacm.cn → Django (gunicorn, :8000)     API + admin
#   account.eacm.cn  → Next.js (`next start`, :3000) SPA — proxies /api/v1/* to passport
#
# Both run on the same host-network nginx container; TLS uses the wildcard
# *.eacm.cn certificate (already deployed to ./nginx/certs/).

upstream passport_app {
    # 同 host 网络：容器内就是宿主机的网络命名空间，web 也跑在 127.0.0.1:8000。
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream passport_frontend {
    # Next.js `next start` 监听 0.0.0.0:3000；同 host 网络走 127.0.0.1。
    server 127.0.0.1:3000;
    keepalive 32;
}

# ============================================================================
# HTTP (port 80) — 强制 HTTPS
# ============================================================================
server {
    listen 80;
    server_name passport.eacm.cn account.eacm.cn;

    # 临时把证书校验放行（不强制 https 也保留此块，便于后续配置变更时回滚调试）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# HTTPS — passport.eacm.cn (Django API)
# ============================================================================
server {
    listen 443 ssl;
    server_name passport.eacm.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 10M;
    proxy_read_timeout 30s;

    # OAuth + unified JWT API.
    location /api/ {
        proxy_pass http://passport_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Django admin.
    location /admin/ {
        proxy_pass http://passport_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # JWKS + discovery (SDKs hit this).
    location /.well-known/ {
        proxy_pass http://passport_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Django static assets (whitenoise).
    location /static/ {
        proxy_pass http://passport_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 用户上传媒体（头像等）：反代到后端，由 Django 直吐 /media/。
    # web 容器已挂载 passport_media 卷做持久化，故这里只是转发。
    location /media/ {
        proxy_pass http://passport_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Passport 是 API；前端 SPA 独立部署在 account.eacm.cn，这里不接 Next.js 资源。
    location /_next/static/ {
        return 404;
    }

    # 根路径：合规说明页（含 ICP 备案号，供 QQ 互联/公安备案审核员访问）。
    # 精确匹配 = / 优先于下方兜底 location /。
    location = / {
        default_type "text/html; charset=utf-8";
        return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lotus 通行证 · 统一认证中心</title></head><body style="font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:8vh auto;padding:0 20px;color:#1a1a1a"><h1 style="font-size:22px">Lotus 通行证</h1><p>统一身份认证（OAuth）API 服务，为 E-algo rank 等接入方提供集中登录与 JWT 签发。</p><p>前端门户：<a href="https://account.eacm.cn/">account.eacm.cn</a></p><p>API 状态：<a href="/api/v1/health/">/api/v1/health/</a></p><hr style="margin:24px 0;border:none;border-top:1px solid #eee"><footer style="font-size:13px;color:#666;line-height:1.8">© 2026 Lotus项目版权所有<br>Lotus通行证&trade; 为演示项目产品名称<br>蜀ICP备2026045461号 <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">工信部备案</a></footer></body></html>';
    }

    # 兜底：未匹配的未知路径返回 API 标识（非根）。
    location / {
        return 200 "Lotus Passport API\n";
        default_type text/plain;
    }
}

# ============================================================================
# HTTPS — account.eacm.cn (Next.js SPA)
# ============================================================================
# 反代到 `next start` (port 3000)。所有路径（含 /api/v1/* 代理）由 Next.js 自己处理，
# 前端进程内部会把 /api/v1/<path> 转发到 PASSPORT_API_ORIGIN（http://127.0.0.1:8000），
# 故 Nginx 不需要在这里另设一条 /api/ location。
# ============================================================================
server {
    listen 443 ssl;
    server_name account.eacm.cn;

    # 复用 *.eacm.cn 证书（subjectAlternativeName 已包含 account.eacm.cn）。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 10M;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://passport_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
