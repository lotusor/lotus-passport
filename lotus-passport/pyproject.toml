[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "passport.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["passport/tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
