# Lotus Passport — 生产部署栈（裸机 PG + Redis 模式）
#   服务器已裸机部署 PostgreSQL(lotus_passport 库/角色) + Redis(强密码)，
#   应用容器直接连 127.0.0.1，因此这里只跑 web(gunicorn) + nginx，
#   不再起 db/redis 容器（避免与裸机实例重复/脱节）。
#
# 用法:
#   1. 确保 .env.production 已就位（含 DATABASE_URL / REDIS_URL 真实连接串）
#   2. docker compose up -d --build
#      entrypoint 会自动: 等 PG 可达 -> 生成 RSA 密钥(首次) -> collectstatic -> migrate -> gunicorn
#   3. 验证: docker compose logs -f web
#
# 前端(lotus-passport-security / Next.js) 独立部署在 account.eacm.cn，
# 本机 passport 先只跑 API；如需在本机也起 SPA，取消 frontend 服务注释并调整 nginx 路由。
#
# RS256 密钥: 首次启动由 entrypoint 生成到 passport_keys 卷;务必离线备份(丢=所有 JWT 失效)。

services:
  web:
    build: .
    # 所有生产配置/密钥来自 .env.production（含 DATABASE_URL/REDIS_URL 连 127.0.0.1 裸机实例）。
    env_file:
      - .env.production
    environment:
      # 容器内需允许 localhost/127.0.0.1 供 healthcheck；对外仅 passport.eacm.cn。
      DEBUG: "False"
      ALLOWED_HOSTS: passport.eacm.cn,localhost,127.0.0.1
      PASSPORT_OAUTH_REDIRECT_BASE: https://passport.eacm.cn/api/v1/oauth
      FRONTEND_SUCCESS_REDIRECT: https://account.eacm.cn/
    depends_on: []
    volumes:
      # RS256 keypair + manifest.json。必须持久：entrypoint 仅在卷为空时生成。
      - passport_keys:/app/keys
      # 用户上传媒体（头像等）持久化：否则写在容器临时层，重建即丢。
      - passport_media:/app/media
    # Host 网络：连裸机 PG/Redis (127.0.0.1)；nginx 也走 host → 反代 127.0.0.1:8000。
    network_mode: "host"
    healthcheck:
      # dev_status 始终可读（返回配置，无越权），作为安全存活探针。
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/dev/status/').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 前端 Next.js SPA — 部署在 account.eacm.cn
  # 同 host 网络（nginx 容器也用 host 网络），反代通过 127.0.0.1:3000。
  # Next.js 内部的 /api/v1/[...path]/route.ts 会再代到 PASSPORT_API_ORIGIN，
  # 形成"浏览器 → nginx:443 → next.js:3000 → passport:8000"的两跳链路，
  # 全程不跨域（同 host 网络 + Next.js 内部 fetch）。
  frontend:
    build: ../lotus-passport-security
    environment:
      # 同 host 网络 → 直接打宿主 127.0.0.1（也等同于容器内 127.0.0.1）
      PASSPORT_API_ORIGIN: http://127.0.0.1:8000
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    healthcheck:
      # Next.js 在没有 build 错误时对任意 GET 都返回 HTML。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s   # 首次启动要 npm ci + next build，给宽裕
    # Host 网络：监听 0.0.0.0:3000 = 宿主机 3000；nginx 反代 127.0.0.1:3000。
    network_mode: "host"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - frontend
    # Host 网络：直接监听宿主 80/443；免去 compose bridge 跟 BT nginx 抢端口的中间层。
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  # RS256 签名密钥 — 见顶部说明。部署后务必离线备份。
  passport_keys:
  # 用户上传媒体（头像等）持久化卷。
  passport_media:
  # Next.js 容器自身把 .next 内置进 image（多阶段 Dockerfile COPY --from=builder），
  # 此处不挂额外卷，避免重启时覆盖固化产物。
